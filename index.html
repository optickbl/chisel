<body>
<title>Chisel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>@font-face{font-family:'DynaPuff';font-style:normal;font-weight:400;font-display:swap;src:url(dynapuff-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'DynaPuff';font-style:normal;font-weight:500;font-display:swap;src:url(dynapuff-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'DynaPuff';font-style:normal;font-weight:600;font-display:swap;src:url(dynapuff-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'DynaPuff';font-style:normal;font-weight:700;font-display:swap;src:url(dynapuff-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Nunito';font-style:normal;font-weight:400;font-display:swap;src:url(nunito-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Nunito';font-style:normal;font-weight:500;font-display:swap;src:url(nunito-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Nunito';font-style:normal;font-weight:600;font-display:swap;src:url(nunito-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Nunito';font-style:normal;font-weight:700;font-display:swap;src:url(nunito-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(nunito-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url(nunito-latin-900-normal.woff2) format('woff2')}</style>
<script id="three-js" async src="three.min.js"></script>
<style>
:root{
  /* Layout: one centered 560px column on a bisque ground with Atlas Red ink. Sticky header, fixed bottom tabs. The hero is an Atlas Red marble slab; every exercise has a 3D stage in warm studio light. Single look in every theme. */
  --bg:#FEE3C5;
  --surface:#FFEBD6;
  --surface-2:#FADBBA;
  --raised:#FFF4E8;
  --field:#FFF7EE;
  --line:#EBC3AE;
  --line-2:#DCA99C;
  --fg:#82193A;
  --fg-2:#7E3B4D;
  --muted:#875060;
  --accent:#82193A;
  --accent-track:rgba(130,25,58,.16);
  --accent-wash:rgba(130,25,58,.08);
  --on-accent:#FEE3C5;
  --good:#2E6B3F;
  --good-wash:rgba(46,107,63,.12);
  --warn:#94560B;
  --warn-wash:rgba(148,86,11,.12);
  --bad:#B3261E;
  --slab-fg:#FEE3C5;
  --slab-fg-2:rgba(254,227,197,.86);
  --slab-track:rgba(254,227,197,.24);
  --vein-base:#82193A;
  --vein:#FEE3C5;
  --halo:rgba(118,20,50,.92);
  --stage-top:#F2D8BC;
  --stage-bot:#DFB48E;
  --stage-pill:rgba(255,246,236,.92);
  --rose:#CC8E9A;
  --scrim:rgba(70,12,30,.38);
  --shadow:0 18px 44px rgba(110,20,45,.18);
  --f-display:"DynaPuff","Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-inscr:"DynaPuff","Nunito",ui-rounded,system-ui,sans-serif;
  --r:12px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;text-decoration:none}
.wordmark{font-family:var(--f-inscr);font-weight:700;font-size:27px;letter-spacing:-.01em;line-height:1}
.season{font-size:12px;color:var(--muted);margin-top:5px}
.top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sync{font-size:12px;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="busy"] i{background:var(--accent)}
.sync[data-s="warn"] i{background:var(--warn)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);text-decoration:none;padding:0}
.icon-btn svg{width:20px;height:20px}

/* type + basics */
.view{display:flex;flex-direction:column;gap:18px;padding-top:16px}
#v-train{padding-bottom:84px}
#checkin{scroll-margin-top:84px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-weight:700;font-size:33px;line-height:1.05;letter-spacing:-.01em;margin:6px 0 0;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;margin:6px 0 0;text-wrap:balance}
.h3{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.meta{color:var(--fg-2);font-size:14.5px;margin-top:6px}
.lede{color:var(--fg-2);font-size:15.5px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h .muted{font-size:13px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.chip.focus{border-color:transparent;background:var(--accent-wash);color:var(--accent);font-weight:600}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.tag.gold{background:var(--accent-wash);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:600;text-decoration:none;font-size:16px;text-align:center}
.btn-gold{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:0}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:0 13px;font-size:14.5px}
.btn-danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.notice{font-size:14.5px;padding:12px 14px;border-radius:10px;background:var(--surface-2);color:var(--fg-2)}
.notice b{color:var(--fg)}
.notice.warn{background:var(--warn-wash);color:var(--fg)}
.notice.good{background:var(--good-wash);color:var(--fg)}
.notice.gold{background:var(--accent-wash);color:var(--fg)}
.prose{font-size:15.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:10px;max-width:64ch}
.prose b{color:var(--fg)}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details > summary{cursor:pointer}

/* marble slab */
.slab{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--vein-base);background:var(--vein-base);color:var(--slab-fg);isolation:isolate}
.slab canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.slab-in{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.slab .eyebrow{color:var(--slab-fg-2);text-shadow:0 0 10px var(--halo)}
.rank{font-family:var(--f-inscr);font-weight:700;font-size:clamp(23px,7vw,29px);letter-spacing:0;line-height:1.08;text-shadow:0 0 14px var(--halo),0 0 3px var(--halo);text-wrap:balance;overflow-wrap:break-word}
.rank-line{color:var(--slab-fg-2);font-size:14.5px;text-shadow:0 0 10px var(--halo),0 0 2px var(--halo)}
.slab-top{display:flex;align-items:stretch;gap:6px}
.slab-eb{display:flex;flex-direction:column;gap:3px}
.slab-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.slab-statue{position:relative;flex:0 0 40%;max-width:170px;min-height:170px;margin:-12px -10px -6px 0;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.slab-statue img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;filter:drop-shadow(0 8px 12px rgba(40,6,18,.35))}
.slab-statue img:not([src]){display:none}
.lv{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);line-height:.82;text-shadow:0 0 18px var(--halo)}
.lv-k{font-weight:700;font-size:22px;color:var(--slab-fg-2);letter-spacing:0}
.lv-n{font-weight:700;font-size:72px}
.lv-meta{font-size:14px;color:var(--slab-fg-2);text-shadow:0 0 10px var(--halo),0 0 2px var(--halo);margin-top:2px}
.lv-meta b{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--slab-fg)}
.xpbar{height:10px;border-radius:999px;background:var(--accent-track);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.slab .xpbar{background:var(--slab-track)}
.slab .xpbar i{background:var(--slab-fg)}
.slab-stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--slab-fg-2);text-shadow:0 0 10px var(--halo),0 0 2px var(--halo)}
.slab-stats b{color:var(--slab-fg);font-weight:700}

/* week strip */
.days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.day .dn{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.day .dm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;border:1.5px solid var(--line-2);color:var(--fg-2)}
.day.rest .dm{border-color:transparent;color:var(--line-2)}
.day.done .dm{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.prog .dm{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
.day.today{border-color:var(--accent)}
.day.today .dn{color:var(--accent)}
.day.missed .dm{color:var(--muted);text-decoration:line-through;border-color:var(--line)}
.day.moved .dm{color:var(--muted);border-color:var(--line)}

/* ledger */
.ledger{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ledger li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ledger li:first-child{border-top:0;padding-top:2px}
.l-xp{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.l-t{min-width:0;font-weight:600}
.l-t small{display:block;color:var(--muted);font-weight:400;font-size:13px}

/* 3D: small previews + the viewer stage */
.pv{position:relative;flex-shrink:0;width:84px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--stage-top),var(--stage-bot));padding:0;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pv img:not([src]){display:none}
.pv-tag{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:800;letter-spacing:.06em;line-height:1;padding:3px 6px;border-radius:999px;background:var(--fg);color:var(--on-accent)}
.pv-off{display:none}
.pv.off img,.pv.off .pv-tag{display:none}
.pv.off .pv-off{display:grid;place-items:center;position:absolute;inset:0;font-size:12px;font-weight:700;color:var(--fg)}
.pv:active{transform:scale(.96)}
.plan-ex .pv{width:96px}
.viz{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,var(--stage-top),var(--stage-bot));cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.viz.tall{aspect-ratio:1/1}
.viz img,.viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.viz img:not([src]){display:none}
.viz canvas{touch-action:pan-y}
.viz-cap{position:absolute;z-index:1;left:10px;bottom:10px;font-size:12px;font-weight:700;letter-spacing:.02em;padding:5px 10px;border-radius:999px;background:var(--fg);color:var(--on-accent);pointer-events:none;white-space:nowrap}
.vz-tempo{position:absolute;z-index:1;left:10px;top:10px;font-family:var(--f-display);font-size:16px;font-weight:800;letter-spacing:0;line-height:1;padding:6px 11px 5px;border-radius:999px;background:var(--stage-pill);color:var(--fg);pointer-events:none;white-space:nowrap}
.viz.off{cursor:default;aspect-ratio:auto;min-height:44px}
.viz.off .viz-cap{position:static;display:inline-block;margin:10px}
.vz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.vz-nav{display:flex;gap:6px}
.vz-title{margin:0}
.vz-mus{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--fg);font-weight:600}
.vz-mus > div{display:flex;gap:10px;align-items:baseline}
.vz-mus .k{flex-shrink:0;width:64px;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vz-mus i{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.vz-mus i.p{background:var(--accent)}
.vz-mus i.s{background:var(--rose)}
.vz-sr{font-size:14.5px;color:var(--fg-2)}
.vz-sr b{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--fg)}
.vz-cue{font-size:15px;color:var(--fg-2);line-height:1.5}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--accent-track);flex-shrink:0}
.sw-list li span{display:inline-flex;align-items:center;gap:8px}
.statue-pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;padding:0;border:0;background:none;cursor:pointer;margin:2px 0 8px;-webkit-tap-highlight-color:transparent}
.statue-pics .sp{position:relative;display:block;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,var(--stage-top),var(--stage-bot))}
.statue-pics img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.statue-pics img:not([src]){display:none}
.statue-pics small{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--stage-pill);color:var(--fg)}
.sp-note{font-size:13.5px;color:var(--muted);margin:0 0 6px}

/* train */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg-2)}
.seg b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.seg small{font-size:12px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--raised);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg .okm{color:var(--good);font-weight:700}
.prog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--fg-2)}
.prog .bar{flex:1;height:8px;border-radius:999px;background:var(--accent-track);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s}
.prog b{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--fg)}
.warm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.warm summary{font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.warm summary .muted{font-size:13px;font-weight:600}
.warm ol{margin:10px 0 2px;padding-left:20px;color:var(--fg-2);font-size:14.5px;display:flex;flex-direction:column;gap:5px}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:90px}
.ex.is-complete{border-color:var(--accent-track)}
.ex-h{display:flex;gap:12px;align-items:flex-start}
.ex-t{flex:1;min-width:0}
.ex-k{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.ex-n{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.02em;color:var(--fg-2);border:1px solid var(--line-2);border-radius:6px;padding:2px 5px 1px;line-height:1.1}
.ex-t h3{margin:0;font-size:17.5px;font-weight:700;line-height:1.2}
.ex-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ex-count{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex.is-complete .ex-count{color:var(--accent)}
.ex-cue{font-size:14.5px;color:var(--fg-2)}
.ex-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;font-size:14px;color:var(--fg-2)}
.ex-meta b{color:var(--fg);font-family:var(--f-display);font-weight:800;font-size:18px}
.ex-meta a,.ex-meta .linkish{font-size:14px;font-weight:700;color:var(--accent);background:none;border:0;padding:4px 0;text-decoration:none}
.ex-last{font-size:14px;color:var(--fg-2);padding:9px 11px;border-radius:8px;background:var(--surface-2)}
.ex-last b{color:var(--fg)}
.ex-last.up b{color:var(--accent)}
.swaprow{display:flex;flex-direction:column;gap:6px}
.swaprow label{font-size:13px;color:var(--muted)}
.sel{height:44px;border-radius:9px;border:1px solid var(--line-2);background:var(--field);padding:0 10px;font-size:16px;width:100%;min-width:0;max-width:100%}
.sets{display:flex;flex-direction:column;gap:6px}

function drawMarble(cv, seed){
  if (!cv) return;
  const rect = cv.getBoundingClientRect(); const w = Math.round(rect.width), h = Math.round(rect.height);
  if (w < 2 || h < 2) return;
  const scale = Math.min(1.5, window.devicePixelRatio || 1) * 0.8;
  const W = Math.max(2, Math.round(w * scale)), H = Math.max(2, Math.round(h * scale));
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'); if (!ctx) return;
  const img = ctx.createImageData(W, H); const d = img.data;
  const cs = getComputedStyle(document.documentElement);
  const base = hexRgb(cs.getPropertyValue('--vein-base')), vein = hexRgb(cs.getPropertyValue('--vein'));
  const rng = mulberry32(seed * 9973 + 17);
  const perm = new Uint16Array(512), vals = new Float32Array(256);
  for (let i = 0; i < 256; i++){ vals[i] = rng(); perm[i] = i; }
  for (let i = 255; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
  const L = (x, y) => vals[perm[(x & 255) + perm[y & 255]]];
  const fade = t => t * t * (3 - 2 * t);
  const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const a = L(xi, yi), b = L(xi + 1, yi), c = L(xi, yi + 1), e = L(xi + 1, yi + 1); const u = fade(xf), v = fade(yf); const top = a + (b - a) * u, bot = c + (e - c) * u; return top + (bot - top) * v; };

  const ang = rng() * Math.PI, ca = Math.cos(ang), sa = Math.sin(ang);
  const ox = rng() * 50, oy = rng() * 50;
  for (let y = 0; y < H; y++){
    for (let x = 0; x < W; x++){
      const nx = x / W * 4 + ox, ny = y / W * 4 + oy;
      const rx = nx * ca - ny * sa, ry = nx * sa + ny * ca;
      const t1 = rx * 1.1 + fbm(nx * 1.5, ny * 1.5) * 3.4;
      const v1 = Math.pow(1 - Math.abs(Math.sin(t1 * Math.PI)), 12);
      const t2 = ry * 2.3 + fbm(nx * 3.1 + 7.3, ny * 3.1 + 1.9) * 2.6;

      const a = clamp(v1 * 0.34 + v2 * 0.2 + cloud + 0.02, 0, 0.48);
      const i = (y * W + x) * 4;
      d[i] = base[0] + (vein[0] - base[0]) * a; d[i + 1] = base[1] + (vein[1] - base[1]) * a; d[i + 2] = base[2] + (vein[2] - base[2]) * a; d[i + 3] = 255;
    }
  }

}
const fx = (() => {

  function size(){ const dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

  const ts = todaySessions(); if (ts.length) return ts[0].m;
  const sched = SCHEDULE[isoDow(todayStr())]; const done = missionsDoneThisWeek();
  if (sched && !done.has(sched)) return sched;
  for (const m of ['A', 'B', 'C']) if (!done.has(m)) return m;
  return sched || 'A';
}
function nextMission(){
  const t = todayStr(); const dow = isoDow(t); const done = missionsDoneThisWeek();
  const ts = todaySessions();
  if (ts.length){ const s = ts[ts.length - 1]; const i = G.info[s.id]; return { kind: i.complete ? 'done' : 'progress', m: s.m, s, i, next: upcoming(t, done) }; }
  const sched = SCHEDULE[dow];
  if (sched && !done.has(sched)) return { kind: 'today', m: sched };
  const pending = ['A', 'B', 'C'].filter(m => !done.has(m));
  const overdue = pending.find(m => MISSION_BY_ID[m].dow < dow) || null;
  return { kind: pending.length ? 'rest' : 'weekdone', overdue, next: upcoming(t, done) };
}
function upcoming(t, done){
  for (let k = 1; k <= 8; k++){ const d = addDays(t, k); const m = SCHEDULE[isoDow(d)]; if (m && (mondayOf(d) !== mondayOf(t) || !done.has(m))) return { m, date: d }; }
  return null;
}

/* rest timer */
const rest = { end: 0, total: 0, timer: 0, goTimer: 0 };
const RING_C = 565.49;
function startRest(sec, sub){
  rest.total = sec; rest.end = Date.now() + sec * 1000;
  const bar = $('#restBar'); bar.hidden = false; bar.classList.remove('go'); $('#restFs').classList.remove('go');
  $('#restK').textContent = 'Rest'; $('#restSub').textContent = sub || '';
  $('#restFsK').textContent = 'Rest'; $('#restFsSub').textContent = sub || '';
  clearTimeout(rest.goTimer); clearTimeout(rest.timer); tickRest();
}
function tickRest(){
  const left = Math.max(0, rest.end - Date.now());
  const frac = rest.total > 0 ? clamp(left / (rest.total * 1000), 0, 1) : 0;
  const label = restLabel(Math.ceil(left / 1000));
  $('#restT').textContent = label; $('#restFsT').textContent = label;
  $('#restLine').style.width = ((1 - frac) * 100).toFixed(1) + '%';
  $('#restRing').style.strokeDashoffset = (RING_C * (1 - frac)).toFixed(2);
  $('#restFsP').textContent = `${Math.ceil(frac * 100)}% left`;
  if (left <= 0){
    const bar = $('#restBar'); bar.classList.add('go'); $('#restK').textContent = 'Go'; $('#restT').textContent = '0:00';
    $('#restFs').classList.add('go'); $('#restFsK').textContent = 'Rest over'; $('#restFsT').textContent = 'Go'; $('#restFsP').textContent = 'Next set';
    sfx.rest(); if (navigator.vibrate) try { navigator.vibrate([120, 80, 120]); } catch (e) {}
    rest.goTimer = setTimeout(stopRest, 6000); return;
  }
  rest.timer = setTimeout(tickRest, 250);
}
function stopRest(){ clearTimeout(rest.timer); clearTimeout(rest.goTimer); const bar = $('#restBar'); if (bar) bar.hidden = true; restFull(false); }
function restFull(on){
  const fs = $('#restFs'); if (!fs) return;
  if (on && $('#restBar').hidden) return;
  if (on === !fs.hidden) return;
  fs.hidden = !on;
  if (on){ rest.back = document.activeElement; const b = fs.querySelector('.skip'); if (b) b.focus(); }
  else if (rest.back && document.contains(rest.back)){ try { rest.back.focus({ preventScroll: true }); } catch (e) {} rest.back = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ if (!$('#restBar').hidden && !$('#restBar').classList.contains('go')){ clearTimeout(rest.timer); tickRest(); } if (state.view === 'train') wantWake(true); } });

/* wake lock */
let wakeLock = null;
async function wantWake(on){
  try {
    if (on && P().wake && 'wakeLock' in navigator && document.visibilityState === 'visible'){ if (!wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
    else if (!on && wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) { wakeLock = null; }
}

function lineChart(el, pts, unit, name){
  if (!el) return;
  if (pts.length < 2){ el.innerHTML = `<p class="muted" style="font-size:14px">${pts.length ? `${pts[0].v} ${unit} on ${shortDate(pts[0].date)}. Two check-ins draw your trend.` : 'Your trend appears after two check-ins.'}</p>`; return; }
  const W = Math.max(260, Math.round(el.clientWidth || 320)), H = 150, pl = 34, pr = 52, pt = 12, pb = 24;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi - lo < 2){ const m0 = (hi + lo) / 2; lo = m0 - 1; hi = m0 + 1; }
  const ticks = niceTicks(lo - (hi - lo) * 0.1, hi + (hi - lo) * 0.1, 3); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const x0 = toDate(pts[0].date).getTime(), x1 = toDate(pts[pts.length - 1].date).getTime(), xr = Math.max(1, x1 - x0);
  const X = d => pl + (toDate(d).getTime() - x0) / xr * (W - pl - pr);
  const Y = v => pt + (1 - (v - lo) / Math.max(1e-9, hi - lo)) * (H - pt - pb);
  const line = pts.map((p, k) => `${k ? 'L' : 'M'}${X(p.date).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area = `${line}L${X(pts[pts.length - 1].date).toFixed(1)},${(H - pb).toFixed(1)}L${X(pts[0].date).toFixed(1)},${(H - pb).toFixed(1)}Z`;
  const lp = pts[pts.length - 1]; const delta = round1(lp.v - pts[0].v);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${name} from ${pts[0].v} to ${lp.v} ${unit}">
    ${ticks.map(v => `<line x1="${pl}" x2="${W - pr + 8}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${v}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" fill-opacity="0.1"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(lp.date).toFixed(1)}" cy="${Y(lp.v).toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${(X(lp.date) + 9).toFixed(1)}" y="${(Y(lp.v) + 4).toFixed(1)}" font-size="12.5" font-weight="700" fill="var(--fg)">${lp.v}</text>
    <text x="${pl}" y="${H - 6}" font-size="11" fill="var(--muted)">${shortDate(pts[0].date)}</text>
    <text x="${W - pr}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${shortDate(lp.date)} · ${delta > 0 ? '+' : ''}${delta} ${unit}</text>
    <line class="xh" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="var(--fg-2)" stroke-width="1" visibility="hidden"/>
    <circle class="xd" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"/>
  </svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('.xh'), xd = svg.querySelector('.xd');
  let cur = pts.length - 1;
  const showAt = k => { cur = k; const p = pts[k]; const x = X(p.date), y = Y(p.v); xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible'); xd.setAttribute('cx', x); xd.setAttribute('cy', y); xd.setAttribute('visibility', 'visible'); const scale = el.clientWidth / W; tip.hidden = false; tip.innerHTML = `<b>${p.v} ${unit}</b>${prettyDate(p.date)}`; const tw = tip.offsetWidth; tip.style.left = clamp(x * scale, tw / 2, el.clientWidth - tw / 2) + 'px'; tip.style.top = Math.max(-46, y * scale - 54) + 'px'; };
  const hide = () => { xh.setAttribute('visibility', 'hidden'); xd.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  const nearest = cx => { const r = svg.getBoundingClientRect(); const x = (cx - r.left) / r.width * W; let best = 0, bd = Infinity; pts.forEach((p, k) => { const d = Math.abs(X(p.date) - x); if (d < bd){ bd = d; best = k; } }); return best; };
  svg.addEventListener('pointermove', e => showAt(nearest(e.clientX)));
  svg.addEventListener('pointerdown', e => showAt(nearest(e.clientX)));
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => showAt(cur));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => { if (e.key === 'ArrowLeft'){ showAt(Math.max(0, cur - 1)); e.preventDefault(); } if (e.key === 'ArrowRight'){ showAt(Math.min(pts.length - 1, cur + 1)); e.preventDefault(); } });
}

  'pick-m': a => { state.trainM = a.dataset.m; state.trainFor = todayStr(); state.swapOpen = null; Viz.stop(); renderTrain(); },
  check: a => onCheck(a),
  viz: a => { if (Viz.dragged()) return; Viz.play(a); },
  'viz-open': a => openViewer(a.dataset.ex, a.dataset.slot, a.dataset.from),
  'viz-prev': () => stepViewer(-1),
  'viz-next': () => stepViewer(1),
  'statue-open': () => openStatue(),
  swap: a => { state.swapOpen = state.swapOpen === a.dataset.slot ? null : a.dataset.slot; const y = window.scrollY; renderTrain(); window.scrollTo(0, y); },
  pswap: a => { state.planSwap = state.planSwap === a.dataset.slot ? null : a.dataset.slot; const y = window.scrollY; renderPlan(); window.scrollTo(0, y); if (state.planSwap){ const sel = $('#psw-' + state.planSwap); if (sel) sel.focus(); } },
  addset: a => { const t = todayStr(); const s = ensureSession(t, state.trainM); const sl = slotById(a.dataset.slot, s); if (!sl) return; const rec = slotRec(s, a.dataset.slot); const p = plannedSets(sl, PHASES[s.ph] ? s.ph : phaseOf(weekNum(t))); while (rec.s.length < p) rec.s.push({}); rec.s.push({}); touch(monthId(t)); const y = window.scrollY; renderTrain(); window.scrollTo(0, y); },
  finish: () => { const t = todayStr(); const s = getSession(t, state.trainM); const i = s && G.info[s.id]; if (!i || i.empty){ toast('Log at least one set first.'); return; } if (!s.fin){ s.fin = Date.now(); touch(monthId(t)); } stopRest(); showSummary(s.id, false); },
  summary: a => showSummary(a.dataset.sid, false),
  'save-checkin': () => saveCheckin(),
  'hist-all': () => { state.showAllHist = !state.showAllHist; renderProgress(); },
  'del-session': a => { const sid = a.dataset.sid; confirmSheet({ title: 'Delete this session?', body: 'Its sets, records and XP are removed. This can’t be undone.', ok: 'Delete session', danger: true, onOk: () => { for (const id of monthIds()){ const md = docs[id]; if (md.sessions && md.sessions[sid]){ delete md.sessions[sid]; touch(id); } } const prev = G; G = compute(); renderView(state.view); afterChange(prev); toast('Session deleted'); } }); },
  oracle: a => askOracle(a.dataset.q),
  'oracle-stop': () => { if (oracle.ctl) oracle.ctl.abort(); },
  'export-save': () => exportSave(),
  'import-save': () => $('#importFile').click(),
  'export-plan': () => offerFile(`Chisel-Program${P().name ? '-' + P().name.replace(/[^A-Za-z0-9]+/g, '') : ''}.html`, planDocHTML(), 'text/html'),
  'export-csv': () => exportCSV(),
  'reset-arm': () => { state.resetArm = true; renderVault(); },
  'reset-cancel': () => { state.resetArm = false; renderVault(); },
  'reset-go': () => { const old = Object.keys(docs); const keepName = P().name; docs = {}; const p = P(); p.name = keepName; for (const k of old) if (k !== 'profile') deleteCloudDoc(k); touch('profile'); state.resetArm = false; G = compute(); renderVault(); toast('Progress reset. Level 1 again.'); },
  sound: () => { const p = P(); p.sound = !p.sound; touch('profile'); renderHeader(); if (p.sound) sfx.tap(); },
  'rest-add': a => { if (Date.now() >= rest.end){ if (+a.dataset.s > 0) startRest(+a.dataset.s, $('#restSub').textContent); return; } rest.end += (+a.dataset.s) * 1000; rest.total = Math.max(rest.total, (rest.end - Date.now()) / 1000); clearTimeout(rest.timer); tickRest(); },
  'rest-skip': () => stopRest(),
  'rest-full': () => restFull(true),
  'rest-min': () => restFull(false),
  close: a => { const then = a && a.dataset && a.dataset.then; closeSheet(); if (then && state.view !== then) location.hash = then; },
  'sheet-ok': () => { const sh = $('#sheet'); const f = sh._onOk; sh._onOk = null; closeSheet(); if (f) f(); },
  'copy-box': () => { const box = $('#copybox'); if (!box) return; const done = () => toast('Copied'); try { navigator.clipboard.writeText(box.value).then(done, () => { box.select(); }); } catch (e) { box.select(); } }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = actions[a.dataset.act]; if (!fn) return;
  if (a.tagName === 'BUTTON') e.preventDefault();
  fn(a, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('.in-w, .in-r')) onSetInput(el);
  else if (el.matches('input[data-p]:not([type="checkbox"]):not([type="date"])')) onProfileInput(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('select[data-swap]')) applySwap(el.dataset.swap, el.value);
  else if (el.matches('input[type="checkbox"][data-p], input[type="date"][data-p]')) onProfileInput(el);
  else if (el.id === 'importFile' && el.files && el.files[0]){ onImportFile(el.files[0]); el.value = ''; }
  else if (el.matches('.in-w, .in-r')){ const prev = G; G = compute(); afterChange(prev); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#restFs').hidden){ restFull(false); return; }
  if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet();
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && vctx && !$('#overlay').hidden && !(e.target.matches && e.target.matches('input,textarea,select'))){ e.preventDefault(); stepViewer(e.key === 'ArrowRight' ? 1 : -1); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.viz[role="button"]')){ e.preventDefault(); Viz.play(e.target); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.in-r')){ const btn = e.target.closest('.set').querySelector('.chk'); if (btn && btn.getAttribute('aria-pressed') !== 'true'){ e.preventDefault(); e.target.blur(); onCheck(btn); } }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.in-w')){ e.preventDefault(); const r = e.target.closest('.set').querySelector('.in-r'); if (r) r.focus(); }
});
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !isEditing()) renderView(state.view); }, 0));
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
let pTimer = 0;
function onProfileInput(el){
  const k = el.dataset.p; const p = P();
  if (el.type === 'checkbox') p[k] = el.checked;
  else if (k === 'name') p.name = el.value.slice(0, 40);
  else if (k === 'startDate'){ if (isDateStr(el.value)) p.startDate = mondayOf(el.value); else return; }
  else return;
  touch('profile');
  clearTimeout(pTimer);
  pTimer = setTimeout(() => {
    G = compute();
    if (k === 'wake') wantWake(state.view === 'train');
    if (k === 'startDate' && state.view === 'vault'){ el.value = P().startDate; }
    renderHeader();
  }, 250);
}
function applySwap(slotId, exId){
  const sl = SLOT_BY_ID[slotId]; if (!sl || !(exId === sl.ex || sl.alts.includes(exId))) return;
  const p = P(); p.swaps[slotId] = exId; touch('profile');
  const t = todayStr(); const s = getSession(t, sl.mission);
  if (s && s.sets[slotId] && !doneSets(s.sets[slotId]).length){ s.sets[slotId] = { ex: exId, s: [] }; touch(monthId(t)); }
  G = compute(); toast(`Swapped to ${EX[exId].n}`);
  Viz.stop();
  if (state.view === 'train'){ state.swapOpen = null; const y = window.scrollY; renderTrain(); window.scrollTo(0, y); }
  else if (state.view === 'plan'){ state.planSwap = null; const y = window.scrollY; renderPlan(); window.scrollTo(0, y); }
}
function saveCheckin(){
  const t = todayStr(); const w = parseNum($('#ci-w').value), wa = parseNum($('#ci-waist').value), sh = parseNum($('#ci-sh').value);
  if (!(w > 0) && !(wa > 0) && !(sh > 0)){ toast('Enter at least one measurement.'); return; }
  if ((w > 0 && (w < 30 || w > 250)) || (wa > 0 && (wa < 40 || wa > 200)) || (sh > 0 && (sh < 60 || sh > 200))){ toast('That number looks off. Weight in kg, measurements in cm.'); return; }
  const md = monthDoc(t, true);
  md.checkins[t] = { ...(w > 0 ? { weight: round1(w) } : {}), ...(wa > 0 ? { waist: round1(wa) } : {}), ...(sh > 0 ? { shoulders: round1(sh) } : {}) };
  touch(monthId(t));
  if (w > 0){ P().weight = round1(w); touch('profile'); }
  const prev = G; G = compute(); const y = window.scrollY; renderProgress(); window.scrollTo(0, y); afterChange(prev);
  toast(G.xp > prev.xp ? `<span>Check-in saved</span><b>+${G.xp - prev.xp}</b>` : 'Check-in updated', G.xp > prev.xp);
}
function onImportFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(String(fr.result));
      if (!o || o.app !== 'chisel' || !o.docs || typeof o.docs !== 'object') throw new Error('bad');
      const ss = []; for (const [k, v] of Object.entries(o.docs)) if (/^m-\d{4}-\d{2}$/.test(k) && v && v.sessions) ss.push(...Object.values(v.sessions));
      const latest = ss.map(s => s && s.date).filter(isDateStr).sort().pop();
      confirmSheet({ title: 'Load this save?', body: `It has ${ss.length} session${ss.length === 1 ? '' : 's'}${latest ? `, the latest on ${prettyDate(latest)}` : ''}. It replaces the progress in this app.`, ok: 'Load save', danger: true, onOk: () => applyImport(o.docs) });
    } catch (e) { toast('That file isn’t a Chisel save.'); }
  };
  fr.readAsText(file);
}
function applyImport(nd){
  const now = Date.now(); const old = Object.keys(docs); docs = {};
  for (const [k, v] of Object.entries(nd)){
    if (!v || typeof v !== 'object') continue;
    if (k === 'profile') docs.profile = { ...v, _t: now, _dev: DEV };
    else if (/^m-\d{4}-\d{2}$/.test(k)) docs[k] = { sessions: v.sessions || {}, checkins: v.checkins || {}, _t: now, _dev: DEV };
    else continue;
    dirty.add(k);
  }
  P(); migratePlan(); docs.profile._t = now; dirty.add('profile');
  for (const k of old) if (!docs[k]) deleteCloudDoc(k);
  saveLocal(); flush(); const prev = G; G = compute(); renderView(state.view); afterChange(prev); toast('Save loaded');
}

/* ---------- boot ---------- */
function buildChrome(){
  $('#tabsIn').innerHTML = [['today', 'Today'], ['train', 'Train'], ['plan', 'Plan'], ['progress', 'Progress']].map(([v, l]) => `<a class="tab" href="#${v}" data-v="${v}">${I[v]}<span>${l}</span></a>`).join('');
  $('#vaultBtn').innerHTML = I.vault;
}
async function initCaps(){
  if (!window.claude || typeof window.claude.use !== 'function'){ sync.mode = 'local'; setSync(); return; }
  const get = n => Promise.resolve().then(() => window.claude.use(n)).catch(() => null);
  const [userNS, dbNS, dl, sm] = await Promise.all([get('user'), get('db'), get('downloads'), get('sample')]);
  caps.downloads = dl || null; caps.sample = sm || null;
  let uid = null; try { uid = userNS ? await userNS.id() : null; } catch (e) { uid = null; }
  if (dbNS && uid) startCloud(dbNS, uid); else { sync.mode = 'local'; setSync(); }
  if (state.view === 'progress' || state.view === 'vault') renderView(state.view);
}
function start(data){
  loadLocal(); P();
  if (migratePlan()) touch('profile');
  G = compute();
  Viz.setGrowth(growthLevels());
  buildChrome();
  if (data && data.trainM && MISSION_BY_ID[data.trainM]){ state.trainM = data.trainM; state.trainFor = todayStr(); }
  const v = (data && (VIEWS.includes(data.view) || ALIASES[data.view])) ? data.view : routeFromHash();
  showView(v, true);
  if (data && typeof data.y === 'number') setTimeout(() => window.scrollTo(0, data.y), 50);
  window.addEventListener('hashchange', () => showView(routeFromHash()));
  let rt = 0; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (state.view === 'today') drawMarble($('#marble'), G.level); if (state.view === 'progress') drawCharts(); }, 200); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state.view === 'today') drawMarble($('#marble'), G.level); }).catch(() => {});
  setInterval(() => { if (!isEditing() && state.view === 'today' && $('#v-today').dataset.day !== todayStr()){ $('#v-today').dataset.day = todayStr(); refreshAll(); } }, 60000);
  $('#v-today').dataset.day = todayStr();
  setSync();
  initCaps();
  Viz.ensure();
  if (!window.claude){
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
    if (IOS && !STANDALONE){ let seen = false; try { seen = !!localStorage.getItem('chisel.a2hs'); localStorage.setItem('chisel.a2hs', '1'); } catch (e) {} if (!seen) setTimeout(() => toast('<b>Install Chisel:</b> tap Share, then Add to Home Screen.', true, 7000), 1400); }
  }
}
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ view: state.view, trainM: state.trainM, y: window.scrollY })); } catch (e) {}
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
